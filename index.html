<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>智慧数学大比拼 | 双人+小组赛</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: linear-gradient(145deg, #1e6b5e 0%, #0a3b32 100%);
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Comic Neue', 'PingFang SC', Roboto, sans-serif;
            padding: 0;
        }

        .game-container {
            width: 100%;
            height: 100vh;
            max-height: 100vh;
            background: rgba(255, 248, 225, 0.95);
            box-shadow: none;
            padding: 10px 14px 15px;
            overflow-y: auto;
            touch-action: pan-y;
            border-radius: 0;
        }
        .game-container::-webkit-scrollbar { width: 6px; }
        .game-container::-webkit-scrollbar-track { background: #e9dccd; border-radius: 3px; }
        .game-container::-webkit-scrollbar-thumb { background: #FFB347; border-radius: 3px; }

        h1 { 
            font-size: clamp(1.2rem, 3.5vw, 1.7rem); 
            text-align: center; 
            background: linear-gradient(135deg, #FFB74D, #FF8A65); 
            background-clip: text; 
            -webkit-background-clip: text; 
            color: transparent; 
            margin-bottom: 8px; 
        }

        .top-toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: #f7e9d0;
            padding: 6px 12px;
            border-radius: 50px;
            margin-bottom: 10px;
        }
        .mode-buttons { display: flex; gap: 6px; }
        .mode-btn {
            background: #e9dccd;
            border: none;
            padding: 7px 16px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
            touch-action: manipulation;
            transition: 0.05s linear;
        }
        .mode-btn:active { transform: scale(0.96); }
        .mode-btn.active { background: #FFB347; color: white; box-shadow: 0 2px 0 #b45f1b; }
        .mode-btn.active:active { transform: scale(0.96); }

        .round-selector {
            display: flex;
            align-items: center;
            gap: 5px;
            background: #FFF2DF;
            padding: 3px 10px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: bold;
            color: #5d3a1a;
        }
        .round-selector select {
            border: none;
            background: white;
            border-radius: 25px;
            padding: 3px 8px;
            font-weight: bold;
            font-size: 0.75rem;
            cursor: pointer;
        }

        .difficulty-selector {
            display: flex;
            align-items: center;
            gap: 5px;
            background: #FFF2DF;
            padding: 3px 10px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: bold;
            color: #5d3a1a;
        }
        .difficulty-selector select {
            border: none;
            background: white;
            border-radius: 25px;
            padding: 3px 8px;
            font-weight: bold;
            font-size: 0.75rem;
            cursor: pointer;
        }

        .round-display {
            font-size: 0.75rem;
            font-weight: bold;
            color: #d35400;
            background: #FFF2DF;
            padding: 4px 12px;
            border-radius: 30px;
        }

        .pause-btn {
            background: #5c8f7c;
            color: white;
            border: none;
            padding: 6px 16px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 0.8rem;
            cursor: pointer;
            touch-action: manipulation;
        }
        .pause-btn:active { transform: scale(0.96); background: #4a7364; }
        .pause-btn.paused { background: #FFB347; }

        .manage-buttons { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
        .file-label, .data-btn {
            background: #5c8f7c;
            border: none;
            padding: 6px 12px;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            font-size: 0.7rem;
            text-align: center;
            touch-action: manipulation;
            transition: 0.05s linear;
        }
        .file-label:active, .data-btn:active { transform: scale(0.96); background: #4a7364; }
        .file-label { background: #FFB347; }
        .danger-btn { background: #d9534f; }
        .reset-group-btn { background: #9b59b6; }
        .fullscreen-btn {
            background: #4682B4;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 0.8rem;
            cursor: pointer;
            touch-action: none;
            transition: 0.05s linear;
        }
        .fullscreen-btn:active { transform: scale(0.96); background: #3a6d99; }
        input[type="file"] { display: none; }
        .disabled-ctrl { opacity: 0.5; pointer-events: none; filter: grayscale(0.1); }
        .question-hidden { display: none !important; }

        /* 多点触控加固（适配希沃一体机）：可交互控件禁止浏览器手势接管（捏合/滚动/双击缩放），
           多人同时点按互不取消、互不误触；触摸按下立即响应，不等 click（希沃驱动下 click 易丢失或延迟） */
        .numpad, .num-btn, .action-btn, .ready-btn, .pick-student-btn, .random-icon,
        .mode-btn, .pause-btn, .data-btn, .file-label, .student-option, .uniform-btn,
        .modal-close, .delete-student-btn {
            touch-action: none;
        }

        .timer-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            background: #2c2e3e;
            border-radius: 50px;
            padding: 6px 20px;
            margin-bottom: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        .timer-bar .timer-label { color: #FFE484; font-size: 0.8rem; font-weight: bold; }
        .timer-bar .timer-digits { font-size: 1.8rem; font-weight: bold; font-family: monospace; color: #FFE484; letter-spacing: 2px; }
        .timer-bar .round-indicator { color: #FFE484; font-size: 0.85rem; font-weight: bold; background: rgba(255,255,255,0.1); padding: 4px 14px; border-radius: 30px; }

        .rank-area {
            background: #FFF3DD;
            border-radius: 40px;
            padding: 8px 12px;
            margin-bottom: 10px;
            border: 2px solid #FFB347;
            text-align: center;
        }
        .rank-title {
            font-size: 0.9rem;
            font-weight: bold;
            background: #FFB347;
            display: inline-block;
            padding: 3px 20px;
            border-radius: 40px;
            color: white;
            margin-bottom: 6px;
        }
        .rank-list {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
            max-height: 120px;
            overflow-y: auto;
            padding: 4px;
        }
        .rank-item {
            background: #EFE3CD;
            border-radius: 30px;
            padding: 3px 12px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-weight: bold;
            font-size: 0.75rem;
        }
        .rank-score { background: #d35400; color: white; border-radius: 25px; padding: 2px 10px; font-size: 0.7rem; }
        .delete-student-btn {
            background: #d9534f;
            color: white;
            border: none;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            font-size: 0.65rem;
            cursor: pointer;
            touch-action: manipulation;
        }
        .delete-student-btn:active { transform: scale(0.9); }
        .delete-student-btn.disabled-delete { opacity: 0.4; pointer-events: none; }

        .battle-wrapper {
            display: flex;
            flex-wrap: nowrap;
            justify-content: space-between;
            align-items: stretch;
            gap: 12px;
            margin-bottom: 12px;
        }
        .battle-wrapper.double-mode .player-card { min-width: 280px; }
        .battle-wrapper.group-mode .player-card { min-width: 220px; }

        .player-card {
            flex: 1;
            background: #FFFDF5;
            border-radius: 35px;
            padding: 10px 12px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
            border: 2px solid #FFD966;
            display: flex;
            flex-direction: column;
        }
        .player-card.paused-card {
            filter: blur(3px);
            pointer-events: none;
        }

        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 5px;
            gap: 5px;
        }
        .player-name-big {
            font-size: 1.1rem;
            background: #FFE0A3;
            padding: 3px 14px;
            border-radius: 40px;
            font-weight: bold;
        }
        .select-controls { display: flex; gap: 4px; }
        .pick-student-btn, .random-icon {
            background: #81b7b0;
            border: none;
            padding: 5px 10px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 0.75rem;
            color: white;
            cursor: pointer;
            touch-action: manipulation;
        }
        .pick-student-btn:active, .random-icon:active { transform: scale(0.95); background: #6a9e96; }
        .random-icon { background: #FFB347; padding: 5px 9px; }

        .ready-btn {
            background: #FFB347;
            border: none;
            border-radius: 50px;
            padding: 8px 0;
            margin-top: 5px;
            font-size: 0.9rem;
            font-weight: bold;
            color: white;
            cursor: pointer;
            touch-action: manipulation;
        }
        .ready-btn:active { transform: scale(0.97); background: #e0a03a; }
        .ready-btn.disabled-btn { background: #ccccaa; pointer-events: none; opacity: 0.6; }
        .ready-status { text-align: center; font-size: 0.65rem; margin-top: 2px; color: #d35400; }

        .score-board { font-size: 0.95rem; text-align: center; background: #F2E8D5; border-radius: 30px; padding: 3px; margin: 4px 0; }
        .score-board .total-score { font-size: 0.7rem; color: #7f8c8d; }

        .question-area {
            background: #fff6e5;
            border-radius: 30px;
            padding: 8px;
            text-align: center;
            border: 2px dashed #FFB347;
            margin-bottom: 5px;
        }
        .question-text { font-size: 1.1rem; font-weight: bold; color: #2d4a3b; font-family: monospace; }
        .answer-area { background: #f0e8d8; border-radius: 25px; padding: 5px; margin-top: 5px; }
        .answer-input {
            background: white;
            border-radius: 35px;
            padding: 6px 8px;
            text-align: center;
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 6px;
            border: 2px solid #FFB347;
            min-height: 40px;
        }
        .numpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
        .numpad-4col { grid-template-columns: repeat(4, 1fr); }
        .numpad-4col .num-btn-confirm { grid-column: span 4; }
        .num-btn {
            background: #81b7b0;
            border: none;
            padding: 8px 0;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: bold;
            color: white;
            cursor: pointer;
            touch-action: manipulation;
        }
        .num-btn:active { transform: scale(0.96); background: #6a9e96; }
        .action-btn { background: #FFB347; }
        .action-btn:active { background: #e0a03a; }
        .penalty-active .num-btn, .penalty-active .action-btn { pointer-events: none; opacity: 0.5; transform: none; }
        .player-card.disabled-click .num-btn, .player-card.disabled-click .action-btn { pointer-events: none; opacity: 0.6; transform: none; }

        .feedback {
            margin-top: 8px;
            text-align: center;
            background: #fff2cc;
            border-radius: 40px;
            padding: 6px;
            font-weight: bold;
            font-size: 0.75rem;
        }
        .countdown-overlay {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.85);
            color: #FFE484;
            font-size: 3.5rem;
            font-weight: bold;
            padding: 20px 40px;
            border-radius: 70px;
            z-index: 2000;
            font-family: monospace;
            backdrop-filter: blur(8px);
            text-align: center;
            pointer-events: none;
        }
        .student-modal, .password-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.75);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 3000;
        }
        .student-modal-content, .password-content {
            background: #FFFDF5;
            border-radius: 50px;
            padding: 20px;
            text-align: center;
            border: 3px solid #FFB347;
            max-width: 90vw;
        }
        .student-modal-content { width: 85%; max-width: 800px; max-height: 80vh; overflow-y: auto; }
        .student-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; margin-bottom: 15px; }
        .student-option {
            background: #81b7b0;
            border: none;
            padding: 10px 5px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: bold;
            color: white;
            cursor: pointer;
            touch-action: manipulation;
        }
        .student-option:active { transform: scale(0.96); background: #6a9e96; }
        .modal-close, .uniform-btn {
            border: none;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
            touch-action: manipulation;
        }
        .modal-close:active, .uniform-btn:active { transform: scale(0.96); }
        .confirm-btn { background: #4CAF50; color: white; }
        .cancel-btn { background: #d9534f; color: white; }

        .group-mode-only { display: none; }
        .group-mode .group-mode-only { display: flex; }
        .group-mode .double-mode-only { display: none; }
        .double-mode .group-mode-only { display: none; }
        .double-mode .double-mode-only { display: flex; }

        @media (max-width: 1100px) {
            .battle-wrapper { flex-wrap: wrap; justify-content: center; }
            .player-card { min-width: 260px !important; max-width: 48%; }
        }
        @media (max-width: 700px) {
            .player-card { max-width: 100%; }
        }
    </style>
</head>
<body>
<div class="game-container" id="gameContainer">
    <h1>🧮 智慧数学大比拼 🧮</h1>

    <div class="top-toolbar">
        <div class="mode-buttons">
            <button class="mode-btn active" data-mode="double">👥 双人对战</button>
            <button class="mode-btn" data-mode="group">🏆 小组赛(4组)</button>
        </div>
        <div class="round-selector group-mode-only">
            <span>轮数：</span>
            <select id="roundCountSelect">
                <option value="12">12 轮</option>
                <option value="15" selected>15 轮</option>
                <option value="20">20 轮</option>
            </select>
        </div>
        <div class="difficulty-selector group-mode-only">
            <span>难度：</span>
            <select id="groupDifficultySelect">
                <option value="addsub">三位数加减</option>
                <option value="muladdsub" selected>一位数乘一位数再加减</option>
                <option value="decimal">两位数加减（带小数点后一位）</option>
            </select>
        </div>
        <div class="round-display group-mode-only" id="roundDisplay">第 0 / 15 轮</div>
        <div class="manage-buttons">
            <label class="file-label double-mode-only" id="fileLabelBtn">📁 导入班级</label>
            <input type="file" id="classFileInput" accept=".txt">
            <button class="data-btn double-mode-only" id="addStudentBtn">➕ 新生</button>
            <button class="data-btn double-mode-only" id="exportDataBtn">💾 备份</button>
            <button class="data-btn double-mode-only" id="restoreDataBtn">📂 还原</button>
            <input type="file" id="restoreFileInput" accept=".json" style="display:none">
            <button class="data-btn danger-btn double-mode-only" id="clearDataBtn">🗑️ 清除双人</button>
            <button class="data-btn reset-group-btn group-mode-only" id="resetGroupBtn">🔄 重置小组积分</button>
            <button class="pause-btn group-mode-only" id="pauseBtn">⏸️ 暂停</button>
        </div>
        <button class="fullscreen-btn" id="fullscreenBtn">⛶ 全屏</button>
    </div>

    <div class="timer-bar">
        <span class="timer-label">⏱️ 剩余时间</span>
        <span class="timer-digits" id="timerDisplay">60</span>
        <span class="timer-label">秒</span>
        <span class="round-indicator" id="roundIndicator">准备中</span>
    </div>

    <div class="rank-area">
        <div class="rank-title" id="rankTitle">🏆 双人荣耀榜 (胜+1 / 负+0.1) 🏆</div>
        <div class="rank-list" id="rankList">暂无学生</div>
    </div>

    <div class="battle-wrapper" id="battleWrapper"></div>
    <div class="feedback" id="feedbackMsg">✨ 双人对战：双方选人后准备 ✨ 小组赛：4组各自准备后开始 ✨</div>
    <div id="countdownOverlay" style="display:none;" class="countdown-overlay"></div>
</div>

<script>
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.body.addEventListener('touchmove', function(e) {
        if (!e.target.closest('.rank-list') && !e.target.closest('.student-modal-content') && !e.target.closest('.game-container')) {
            e.preventDefault();
        }
    }, { passive: false });

    const DELETE_PASSWORD = "999999";
    const RANK_BONUS_ENABLED = false;
    const GROUP_TIME = 60;
    const ROUND_COUNT_DEFAULT = 15;
    let currentGrade = 4;
    let gameMode = "double";
    let groupDifficulty = "muladdsub";

    // ===== 多点触控支持（适配希沃一体机）：按下即触发（pointerdown），每根手指独立响应，
    //      并阻止浏览器生成“幽灵点击”误触其他区域；老内核浏览器自动回退到 touchstart/mousedown =====
    function bindPress(el, handler) {
        if (!el) return;
        if (window.PointerEvent) {
            el.addEventListener('pointerdown', (e) => {
                if (e.pointerType === 'mouse' && e.button !== 0) return; // 仅响应左键/触摸/触控笔
                e.preventDefault();
                handler(e);
            });
        } else {
            let suppressMouse = false;
            el.addEventListener('touchstart', (e) => {
                suppressMouse = true;
                setTimeout(() => { suppressMouse = false; }, 500);
                e.preventDefault();
                handler(e);
            }, { passive: false });
            el.addEventListener('mousedown', (e) => {
                if (suppressMouse || e.button !== 0) return;
                e.preventDefault();
                handler(e);
            });
        }
    }

    function generateMathQuestion(grade) {
        let a, b, answer, questionText;
        const useAdd = Math.random() < 0.5;
        if (grade === 1) {
            if (useAdd) { a = Math.floor(Math.random() * 21); b = Math.floor(Math.random() * (21 - a)); answer = a + b; questionText = `${a} + ${b} = ?`; }
            else { a = Math.floor(Math.random() * 21); b = Math.floor(Math.random() * (a + 1)); answer = a - b; questionText = `${a} - ${b} = ?`; }
        } else if (grade === 3) {
            const useMul = Math.random() < 0.4;
            if (useMul) { a = Math.floor(Math.random() * 8) + 2; b = Math.floor(Math.random() * 8) + 2; answer = a * b; questionText = `${a} × ${b} = ?`; }
            else if (useAdd) { a = Math.floor(Math.random() * 91); b = Math.floor(Math.random() * (91 - a)); answer = a + b; questionText = `${a} + ${b} = ?`; }
            else { a = Math.floor(Math.random() * 91); b = Math.floor(Math.random() * (a + 1)); answer = a - b; questionText = `${a} - ${b} = ?`; }
        } else {
            const type = Math.floor(Math.random() * 3);
            if (type === 0) {
                if (Math.random() < 0.5) { a = Math.floor(Math.random() * 91); b = Math.floor(Math.random() * (91 - a)); answer = a + b; questionText = `${a} + ${b} = ?`; }
                else { a = Math.floor(Math.random() * 91); b = Math.floor(Math.random() * (a + 1)); answer = a - b; questionText = `${a} - ${b} = ?`; }
            } else if (type === 1) { a = Math.floor(Math.random() * 90) + 10; b = Math.floor(Math.random() * 8) + 2; answer = a * b; questionText = `${a} × ${b} = ?`; }
            else { b = Math.floor(Math.random() * 9) + 1; const quotient = Math.floor(Math.random() * 10) + 1; a = b * quotient; answer = quotient; questionText = `${a} ÷ ${b} = ?`; }
        }
        return { questionText, correctAnswer: answer.toString() };
    }

    function generateGroupMathQuestion(difficulty) {
        let a, b, answer, questionText;
        if (difficulty === 'addsub') {
            // 三位数 ± 三位数，结果小于1000（减法结果不小于0）
            const useAdd = Math.random() < 0.5;
            if (useAdd) {
                a = Math.floor(Math.random() * 400) + 100;          // 100~499
                const maxB = Math.min(999, 999 - a);                // 保证 a+b<1000
                b = Math.floor(Math.random() * (maxB - 99)) + 100;  // 100~maxB
                answer = a + b;
                questionText = `${a} + ${b} = ?`;
            } else {
                a = Math.floor(Math.random() * 900) + 100;          // 100~999
                b = Math.floor(Math.random() * (a - 99)) + 100;     // 100~a
                answer = a - b;
                questionText = `${a} - ${b} = ?`;
            }
        } else if (difficulty === 'muladdsub') {
            // 一位数 × 一位数，再加减一个数，结果小于200且不小于0
            a = Math.floor(Math.random() * 8) + 2;   // 2~9
            b = Math.floor(Math.random() * 8) + 2;   // 2~9
            const product = a * b;                   // 4~81
            if (Math.random() < 0.5) {
                const maxD = Math.min(99, 199 - product);           // 保证和<200
                const d = Math.floor(Math.random() * (maxD - 9)) + 10; // 加一个两位数 10~maxD
                answer = product + d;
                questionText = `${a} × ${b} + ${d} = ?`;
            } else {
                const maxD = product - 1;                           // 保证差≥0
                const d = (maxD >= 10)
                    ? Math.floor(Math.random() * (maxD - 9)) + 10   // 减一个两位数
                    : Math.floor(Math.random() * maxD) + 1;         // 减一个一位数
                answer = product - d;
                questionText = `${a} × ${b} - ${d} = ?`;
            }
        } else {
            // 三位数加减（带小数点后一位，结果小于50）：用十分位整数运算，避免浮点误差
            const useAdd = Math.random() < 0.5;
            if (useAdd) {
                const aT = Math.floor(Math.random() * 380) + 100;       // 10.0~47.9（十分位）
                const maxBT = 499 - aT;                                 // 保证和<50.0
                const bT = Math.floor(Math.random() * (maxBT - 9)) + 10; // 1.0~maxBT
                answer = (aT + bT) / 10;
                questionText = `${(aT / 10).toFixed(1)} + ${(bT / 10).toFixed(1)} = ?`;
            } else {
                const aT = Math.floor(Math.random() * 300) + 200;       // 20.0~49.9（十分位）
                const maxBT = aT - 10;                                  // 保证差≥1.0
                const bT = Math.floor(Math.random() * (maxBT - 9)) + 10; // 1.0~maxBT
                answer = (aT - bT) / 10;
                questionText = `${(aT / 10).toFixed(1)} - ${(bT / 10).toFixed(1)} = ?`;
            }
        }
        return { questionText, correctAnswer: (difficulty === 'decimal') ? answer.toFixed(1) : answer.toString() };
    }

    // ===== 小组赛“相近题组”：四人算式完全自由（互不相同），只约束结果相差≤3（整数）/≤0.5（小数）=====
    function answerBase10(q) {
        // 返回答案的整数形式（小数题扩大10倍为十分位整数），便于比较
        if (groupDifficulty === 'decimal') return Math.round(parseFloat(q.correctAnswer) * 10);
        return parseInt(q.correctAnswer, 10);
    }

    // 生成一道结果恰好为 t 的题（t 为十分位整数/普通整数），算式自由组合
    function genQuestionWithAnswer(t, difficulty) {
        if (difficulty === 'addsub') {
            if (Math.random() < 0.5) {
                if (t < 200 || t > 999) return null;
                const maxA = Math.min(499, t - 100);
                if (maxA < 100) return null;
                const a = Math.floor(Math.random() * (maxA - 100 + 1)) + 100;
                const b = t - a;
                return { questionText: `${a} + ${b} = ?`, correctAnswer: String(t) };
            } else {
                if (t < 0 || t > 899) return null;
                const minA = t + 100;
                if (minA > 999) return null;
                const a = Math.floor(Math.random() * (999 - minA + 1)) + minA;
                const b = a - t;
                return { questionText: `${a} - ${b} = ?`, correctAnswer: String(t) };
            }
        } else if (difficulty === 'muladdsub') {
            if (t < 0 || t > 180) return null;
            for (let k = 0; k < 60; k++) {
                const a = Math.floor(Math.random() * 8) + 2;   // 2~9
                const b = Math.floor(Math.random() * 8) + 2;   // 2~9
                const prod = a * b;
                if (Math.random() < 0.5) {
                    const d = t - prod;                        // 加法：a×b+d
                    if (d >= 1 && d <= 99) return { questionText: `${a} × ${b} + ${d} = ?`, correctAnswer: String(t) };
                    const d2 = prod - t;                       // 减法：a×b-d
                    if (d2 >= 1 && d2 <= prod - 1) return { questionText: `${a} × ${b} - ${d2} = ?`, correctAnswer: String(t) };
                } else {
                    const d2 = prod - t;
                    if (d2 >= 1 && d2 <= prod - 1) return { questionText: `${a} × ${b} - ${d2} = ?`, correctAnswer: String(t) };
                    const d = t - prod;
                    if (d >= 1 && d <= 99) return { questionText: `${a} × ${b} + ${d} = ?`, correctAnswer: String(t) };
                }
            }
            return null;
        } else { // decimal，t 为十分位整数
            if (Math.random() < 0.5) {
                if (t < 110 || t > 499) return null;
                const minA = Math.max(100, t - 499), maxA = Math.min(479, t - 10);
                if (maxA < minA) return null;
                const aT = Math.floor(Math.random() * (maxA - minA + 1)) + minA;
                const bT = t - aT;
                return { questionText: `${(aT / 10).toFixed(1)} + ${(bT / 10).toFixed(1)} = ?`, correctAnswer: (t / 10).toFixed(1) };
            } else {
                if (t < 0 || t > 489) return null;
                const minA = t + 10;
                if (minA > 499) return null;
                const aT = Math.floor(Math.random() * (499 - minA + 1)) + minA;
                const bT = aT - t;
                return { questionText: `${(aT / 10).toFixed(1)} - ${(bT / 10).toFixed(1)} = ?`, correctAnswer: (t / 10).toFixed(1) };
            }
        }
    }

    function buildClusterQuestions() {
        const base = generateGroupMathQuestion(groupDifficulty);
        const A = answerBase10(base);
        const W = (groupDifficulty === 'decimal') ? 5 : 3;   // 窗口宽度：整数±3、小数±0.5（十分位）
        const upper = (groupDifficulty === 'muladdsub') ? 180 : (groupDifficulty === 'decimal' ? 499 : 999);
        const winMax = Math.min(A + W, upper);
        if (winMax < A) return null;
        // 结果窗口 [A, winMax]，从中取4个目标答案（窗口窄时允许重复，题目仍互不相同）
        const vals = [];
        for (let v = A; v <= winMax; v++) vals.push(v);
        for (let i = vals.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            const t = vals[i]; vals[i] = vals[j]; vals[j] = t;
        }
        const targets = [];
        for (let i = 0; i < 4; i++) targets.push(vals[i % vals.length]);
        // 逐人生成互不相同的自由算式
        const qs = [];
        const used = new Set();
        for (let i = 0; i < 4; i++) {
            let q = null;
            for (let tries = 0; tries < 200 && !q; tries++) {
                q = genQuestionWithAnswer(targets[i], groupDifficulty);
                if (q && used.has(q.questionText)) q = null;
            }
            if (!q) return null; // 换基准题整组重试
            used.add(q.questionText);
            qs.push(q);
        }
        return qs;
    }

        if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }

        if (gameMode === 'double') {
            const leftScore = displayedScore[0];

            if (leftScore > rightScore) { winnerName = leftName; loserName = rightName; }
            else if (rightScore > leftScore) { winnerName = rightName; loserName = leftName; }
            let message = "";
            if (winnerName && winnerName !== "待选" && allStudents.some(s => s.name === winnerName)) {
                addScoreToStudent(winnerName, 1.0);

                message = `🤝 平局！ 比分 ${leftScore} : ${rightScore}，双方不加分`;

            document.getElementById('pName0').innerText = leftName;

            resetReadyState();
            for (let i = 0; i < 2; i++) {

                document.getElementById(`answerDisplay${i}`).innerHTML = "?";

            if (currentRound < totalRounds) {
                feedbackDiv.innerHTML = `✅ 第 ${currentRound} 轮结束！ 5秒后自动开始第 ${currentRound + 1} 轮...`;
                speakText("本轮结束，准备下一轮");
                let remain = 5;
                countdownOverlay.style.display = "flex";
                countdownOverlay.innerText = remain;
                speakNumber(remain);
                const nextRoundTimer = setInterval(() => {
                    remain--;
                    if (remain <= 0) {
                        clearInterval(nextRoundTimer);
                        countdownOverlay.style.display = "none";
                        resetReadyState();
                        for (let i = 0; i < 4; i++) {
                            questionAreaHide(i);
                        }
                        beginRound();
                    } else {
                        countdownOverlay.innerText = remain;
                        speakNumber(remain);
                    }
                }, 1000);
            } else {
                showGroupFinalRanking();
            }
        }
    }

    function showGroupFinalRanking() {
        const sorted = groupTotalScore.map((score, idx) => ({ idx, score })).sort((a, b) => b.score - a.score);
        let html = `🎉 小组赛全部 ${totalRounds} 轮完成！<br>`;
        sorted.forEach((item, rank) => {
            const medal = rank === 0 ? '🥇' : rank === 1 ? '🥈' : rank === 2 ? '🥉' : '🏅';
            html += `${medal} 第${item.idx + 1}组：${item.score} 分<br>`;
        });
        feedbackDiv.innerHTML = html;
        updateRankingUI();
        roundIndicator.innerText = '已完成';
    }

    function togglePause() {
        if (!gameActive) {
            feedbackDiv.innerHTML = "⚠️ 当前没有进行中的比赛";
            return;
        }
        isPaused = !isPaused;
        if (isPaused) {
            pauseBtn.classList.add('paused');
            pauseBtn.innerText = "▶️ 继续";
            for (let i = 0; i < 4; i++) {
                const card = document.getElementById(`playerCard${i}`);
                if (card) card.classList.add('paused-card');
            }
            feedbackDiv.innerHTML = "⏸️ 已暂停，点击继续恢复";
        } else {
            pauseBtn.classList.remove('paused');
            pauseBtn.innerText = "⏸️ 暂停";
            for (let i = 0; i < 4; i++) {
                const card = document.getElementById(`playerCard${i}`);
                if (card) card.classList.remove('paused-card');
            }
            feedbackDiv.innerHTML = "▶️ 继续比赛";
        }
    }

    function setAllControlsDisabled(disabled) {
        const btns = document.querySelectorAll('.manage-buttons button, .manage-buttons .file-label, .pick-student-btn, .random-icon');
        btns.forEach(btn => {
            if (disabled) { btn.classList.add('disabled-ctrl'); btn.style.pointerEvents = 'none'; }
            else { btn.classList.remove('disabled-ctrl'); btn.style.pointerEvents = ''; }
        });
        document.querySelectorAll('.delete-student-btn').forEach(btn => {
            if (disabled) btn.classList.add('disabled-delete');
            else btn.classList.remove('disabled-delete');
        });
    }

    function updateRankingUI() {
        if (gameMode === 'double') {
            rankTitleSpan.innerHTML = "🏆 双人荣耀榜 (胜+1 / 负+0.1) 🏆";
            if (allStudents.length === 0) { rankListDiv.innerHTML = "<div>暂无学生</div>"; return; }
            let sorted = [...allStudents].sort((a, b) => (b.wins || 0) - (a.wins || 0));
            let html = '';
            for (let stu of sorted) {
                let scoreVal = stu.wins || 0;
                let displayScore = Number.isInteger(scoreVal) ? scoreVal : scoreVal.toFixed(1);
                html += `<div class="rank-item"><span>${escapeHtml(stu.name)}</span><span class="rank-score">🏅 ${displayScore}</span><button class="delete-student-btn" data-name="${escapeHtml(stu.name)}">✖</button></div>`;
            }
            rankListDiv.innerHTML = html;
            document.querySelectorAll('.delete-student-btn').forEach(btn => bindPress(btn, (e) => {
                e.stopPropagation();
                showPasswordModal(btn.getAttribute('data-name'), 'delete');
            }));
        } else {
            rankTitleSpan.innerHTML = "🏆 小组赛榜 (四组总分) 🏆";
            let sorted = groupTotalScore.map((score, idx) => ({ idx, score })).sort((a, b) => b.score - a.score);
            let html = '';
            sorted.forEach((item, rank) => {
                const medal = rank === 0 ? '🥇' : rank === 1 ? '🥈' : rank === 2 ? '🥉' : '🏅';
                html += `<div class="rank-item"><span>${medal} 第${item.idx + 1}组</span><span class="rank-score">🏅 ${item.score} 分</span></div>`;
            });
            rankListDiv.innerHTML = html;
        }
        saveAllData();
    }

    function escapeHtml(str) { return String(str).replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;'); }
    function saveAllData() {
        try {
            if (allStudents.length) localStorage.setItem(STORAGE_STUDENTS, JSON.stringify(allStudents));
            else localStorage.removeItem(STORAGE_STUDENTS);
            localStorage.setItem(STORAGE_GROUP, JSON.stringify(groupTotalScore));
        } catch (e) { }
    }
    function saveGroupData() { try { localStorage.setItem(STORAGE_GROUP, JSON.stringify(groupTotalScore)); } catch (e) { } }
    function loadAllData() {
        const stored = localStorage.getItem(STORAGE_STUDENTS);
        if (stored) try { let arr = JSON.parse(stored); if (Array.isArray(arr)) allStudents = arr; } catch (e) { }
        const g = localStorage.getItem(STORAGE_GROUP);
        if (g) try { let arr = JSON.parse(g); if (Array.isArray(arr) && arr.length === 4) groupTotalScore = arr; } catch (e) { }
    }
    function addScoreToStudent(name, points) {
        if (points === 0) return;
        let stu = allStudents.find(s => s.name === name);
        if (stu) stu.wins = (stu.wins || 0) + points;
        else allStudents.push({ name: name, wins: points });
        updateRankingUI();
        saveAllData();
    }

    function switchMode(mode) {
        if (gameActive || countdownActive) {
            feedbackDiv.innerHTML = "请先结束当前对局再切换模式";
            return;
        }
        gameMode = mode;
        modeBtns.forEach(btn => {
            if (btn.getAttribute('data-mode') === mode) btn.classList.add('active');
            else btn.classList.remove('active');
        });
        gameContainer.classList.remove('double-mode', 'group-mode');
        gameContainer.classList.add(mode === 'double' ? 'double-mode' : 'group-mode');
        resetAllGameState();
        buildPlayerCards();
        updateRankingUI();
        if (mode === 'double') {
            feedbackDiv.innerHTML = "✨ 双人对战模式：双方选人后准备 ✨";
            roundDisplay.innerText = "";
            roundIndicator.innerText = "准备中";
        } else {
            totalRounds = parseInt(roundCountSelect.value) || 15;
            groupDifficulty = groupDifficultySelect.value || 'muladdsub';
            currentRound = 0;
            roundDisplay.innerText = `第 0 / ${totalRounds} 轮`;
            roundIndicator.innerText = "等待准备";
            feedbackDiv.innerHTML = `✨ 小组赛模式：4组各派1人，第1轮准备后开始，之后自动进行 ✨ 共 ${totalRounds} 轮，难度：${getDifficultyName(groupDifficulty)}`;
        }
        setAllControlsDisabled(false);
    }

    function resetAllGameState() {
        if (timerInterval) clearInterval(timerInterval);
        if (countdownInterval) clearInterval(countdownInterval);
        gameActive = false;
        countdownActive = false;
        isPaused = false;
        pauseBtn.classList.remove('paused');
        pauseBtn.innerText = "⏸️ 暂停";
        countdownOverlay.style.display = "none";
        for (let i = 0; i < 4; i++) {
            if (penaltyTimers[i]) clearTimeout(penaltyTimers[i]);
            penaltyActive[i] = false;
            answerLock[i] = false;
            isReady[i] = false;
            displayedScore[i] = 0;
            currentAnswers[i] = "";
        }
        currentQuestions = [null, null, null, null];
        timeLeft = 60;
        timerDisplay.innerText = "60";
    }

    function showStudentPicker(side) {
        if (allStudents.length === 0) { feedbackDiv.innerHTML = "❌ 暂无学生"; return; }
        const modal = document.createElement('div');
        modal.className = 'student-modal';
        let html = '<div class="student-modal-content"><div class="student-modal-title">📋 选择选手</div><div class="student-grid" id="studentGrid">';
        for (let s of allStudents) html += `<button class="student-option" data-name="${escapeHtml(s.name)}">${escapeHtml(s.name)}</button>`;
        html += `</div><button class="modal-close">取消</button></div>`;
        modal.innerHTML = html;
        document.body.appendChild(modal);
        const grid = modal.querySelector('#studentGrid');
        const closeBtn = modal.querySelector('.modal-close');
        const handleSelect = (e) => {
            const btn = e.target.closest('.student-option');
            if (btn && btn.dataset.name) {
                const name = btn.dataset.name;
                if (side === 0) leftName = name;
                else rightName = name;
                document.getElementById(`pName${side}`).innerText = name;
                updateReadyBtnState();
                resetReadyState();
                feedbackDiv.innerHTML = `已选择：${name}`;
                modal.remove();
            }
        };
        bindPress(grid, handleSelect);
        bindPress(closeBtn, () => modal.remove());
        bindPress(modal, (e) => { if (e.target === modal) modal.remove(); });
    }

    function randomPick(side) {
        if (allStudents.length === 0) { feedbackDiv.innerHTML = "❌ 暂无学生"; return; }
        let exclude = (side === 0 && rightName !== "待选") ? rightName : (side === 1 && leftName !== "待选") ? leftName : null;
        let available = allStudents.filter(s => s.name !== exclude);
        if (available.length === 0) { feedbackDiv.innerHTML = "没有可选的对手"; return; }
        let newName = available[Math.floor(Math.random() * available.length)].name;
        if (side === 0) leftName = newName;
        else rightName = newName;
        document.getElementById(`pName${side}`).innerText = newName;
        updateReadyBtnState();
        resetReadyState();
        feedbackDiv.innerHTML = `随机选择：${newName}`;
    }

    function updateReadyBtnState() {
        for (let i = 0; i < 4; i++) {
            const btn = document.getElementById(`readyBtn${i}`);
            if (!btn) continue;
            if (gameMode === 'double') {
                const name = (i === 0) ? leftName : (i === 1) ? rightName : null;
                if (i < 2 && name && name !== "待选" && allStudents.some(s => s.name === name)) {
                    btn.classList.remove('disabled-btn');
                } else {
                    btn.classList.add('disabled-btn');
                }
            } else {
                btn.classList.remove('disabled-btn');
            }
        }
    }

    function importTXTFile(file) {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function (e) {
            const lines = e.target.result.split(/\r?\n/);
            const names = [];
            for (let line of lines) { let n = line.trim(); if (n && !names.includes(n)) names.push(n); }
            if (names.length === 0) { feedbackDiv.innerHTML = "❌ 没有有效姓名"; return; }
            const map = new Map(); for (let s of allStudents) map.set(s.name, s.wins);
            allStudents = names.map(n => ({ name: n, wins: map.get(n) || 0 }));
            leftName = "待选"; rightName = "待选";
            updateRankingUI();
            if (gameMode === 'double') buildPlayerCards();
            feedbackDiv.innerHTML = `✅ 导入成功！共 ${names.length} 名学生`;
            saveAllData();
        };
        reader.readAsText(file, "UTF-8");
    }

    function exportToJSON() {
        if (allStudents.length === 0) { feedbackDiv.innerHTML = "❌ 暂无数据"; return; }
        const data = { version: "1.0", exportTime: new Date().toLocaleString(), students: allStudents };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `class_backup_${new Date().toISOString().slice(0, 19).replace(/:/g, '-')}.json`;
        a.click();
        URL.revokeObjectURL(a.href);
        feedbackDiv.innerHTML = "✅ 数据已导出";
    }

    function restoreFromJSON(file) {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function (e) {
            try {
                const data = JSON.parse(e.target.result);
                if (data.students && Array.isArray(data.students)) {
                    allStudents = data.students.filter(s => s.name).map(s => ({ name: s.name, wins: s.wins || 0 }));
                    leftName = "待选"; rightName = "待选";
                    updateRankingUI();
                    if (gameMode === 'double') buildPlayerCards();
                    feedbackDiv.innerHTML = `✅ 还原成功！共 ${allStudents.length} 名学生`;
                    saveAllData();
                } else throw new Error();
            } catch (err) { feedbackDiv.innerHTML = "❌ 还原失败：文件格式错误"; }
        };
        reader.readAsText(file, "UTF-8");
    }

    function addNewStudent(name) {
        if (!name || name.trim() === "") { feedbackDiv.innerHTML = "❌ 请输入姓名"; return false; }
        name = name.trim();
        if (allStudents.some(s => s.name === name)) { feedbackDiv.innerHTML = `❌ "${name}" 已存在`; return false; }
        allStudents.push({ name: name, wins: 0 });
        updateRankingUI(); saveAllData();
        feedbackDiv.innerHTML = `✅ 添加新生：${name}`;
        return true;
    }

    function showAddStudentModal() {
        const modal = document.createElement('div');
        modal.className = 'student-modal';
        modal.innerHTML = `<div class="student-modal-content" style="max-width:350px"><div class="student-modal-title">➕ 添加新生</div><input type="text" id="newStudentName" placeholder="请输入学生姓名" style="width:100%;padding:8px;border-radius:30px;border:2px solid #FFB347;font-size:0.9rem;margin-bottom:12px;"><div style="display:flex;gap:10px;justify-content:center"><button class="uniform-btn confirm-btn" id="confirmAddBtn">确认</button><button class="uniform-btn cancel-btn" id="cancelAddBtn">取消</button></div></div>`;
        document.body.appendChild(modal);
        const input = modal.querySelector('#newStudentName');
        const confirmBtn = modal.querySelector('#confirmAddBtn');
        const cancelBtn = modal.querySelector('#cancelAddBtn');
        const doAdd = () => { addNewStudent(input.value); modal.remove(); };
        bindPress(confirmBtn, doAdd);
        bindPress(cancelBtn, () => modal.remove());
        input.addEventListener('keypress', e => { if (e.key === 'Enter') doAdd(); });
    }

    function showPasswordModal(targetName, type) {
        const modal = document.createElement('div');
        modal.className = 'password-modal';
        modal.innerHTML = `<div class="password-content"><h3>🔐 ${type === 'delete' ? `删除 "${escapeHtml(targetName)}"` : (type === 'resetGroup' ? '重置小组积分' : '清除双人数据')}</h3><p>需要密码确认</p><input type="password" id="actionPassword" placeholder="请输入密码" autocomplete="off"><div style="display:flex;gap:8px;justify-content:center;margin-top:12px"><button class="uniform-btn confirm-btn" id="confirmActionBtn">确认</button><button class="uniform-btn cancel-btn" id="cancelActionBtn">取消</button></div></div>`;
        document.body.appendChild(modal);
        const input = modal.querySelector('#actionPassword');
        const confirmBtn = modal.querySelector('#confirmActionBtn');
        const cancelBtn = modal.querySelector('#cancelActionBtn');
        const close = () => modal.remove();
        const doConfirm = () => {
            if (input.value === DELETE_PASSWORD) {
                if (type === 'delete') {
                    allStudents = allStudents.filter(s => s.name !== targetName);
                    if (leftName === targetName) leftName = "待选";
                    if (rightName === targetName) rightName = "待选";
                    updateRankingUI();
                    if (gameMode === 'double') buildPlayerCards();
                    feedbackDiv.innerHTML = `✅ 已删除：${targetName}`;
                    saveAllData();
                } else if (type === 'resetGroup') {
                    groupTotalScore = [0, 0, 0, 0];
                    saveGroupData();
                    updateRankingUI();
                    if (gameMode === 'group') {
                        for (let i = 0; i < 4; i++) {
                            const totalEl = document.getElementById(`totalScore${i}`);
                            if (totalEl) totalEl.innerText = ` (总:0分)`;
                        }
                    }
                    feedbackDiv.innerHTML = "🔄 小组积分已重置";
                } else {
                    allStudents = [];
                    localStorage.removeItem(STORAGE_STUDENTS);
                    updateRankingUI();
                    if (gameMode === 'double') buildPlayerCards();
                    feedbackDiv.innerHTML = "🗑️ 双人数据已清空";
                }
                close();
            } else {
                feedbackDiv.innerHTML = "❌ 密码错误";
                close();
            }
        };
        bindPress(confirmBtn, doConfirm);
        bindPress(cancelBtn, close);
        input.addEventListener('keypress', e => { if (e.key === 'Enter') doConfirm(); });
    }

    function clearAllDataWithPassword() { showPasswordModal('', 'clear'); }

    function bindPlayerEvents() {
        for (let i = 0; i < 4; i++) {
            const btn = document.getElementById(`readyBtn${i}`);
            if (!btn) continue;
            bindPress(btn, () => {
                if (gameActive || countdownActive) { feedbackDiv.innerHTML = "比赛进行中"; return; }
                toggleReady(i, !isReady[i]);
            });
        }
        document.querySelectorAll('.pick-student-btn').forEach(btn => {
            bindPress(btn, () => { let side = parseInt(btn.getAttribute('data-side')); showStudentPicker(side); });
        });
        document.querySelectorAll('.random-icon').forEach(btn => {
            bindPress(btn, () => { let side = parseInt(btn.getAttribute('data-side')); randomPick(side); });
        });
    }

    modeBtns.forEach(btn => {
        bindPress(btn, () => switchMode(btn.getAttribute('data-mode')));
    });

    roundCountSelect.addEventListener('change', () => {
        if (gameActive) { feedbackDiv.innerHTML = "比赛中不能修改轮数"; roundCountSelect.value = totalRounds; return; }
        totalRounds = parseInt(roundCountSelect.value);
        currentRound = 0;
        roundDisplay.innerText = `第 0 / ${totalRounds} 轮`;
        roundIndicator.innerText = "等待准备";
    });

    groupDifficultySelect.addEventListener('change', () => {
        if (gameActive || countdownActive) {
            feedbackDiv.innerHTML = "比赛准备/进行中不能修改难度";
            groupDifficultySelect.value = groupDifficulty;
            return;
        }
        groupDifficulty = groupDifficultySelect.value;
        if (gameMode === 'group') {
            buildPlayerCards(); // 重建数字键盘（小数难度需显示小数点键）
            feedbackDiv.innerHTML = `📚 难度已切换：${getDifficultyName(groupDifficulty)}`;
        }
    });

    bindPress(pauseBtn, togglePause);
    bindPress(resetGroupBtn, () => showPasswordModal('', 'resetGroup'));

    bindPress(document.getElementById('fileLabelBtn'), () => document.getElementById('classFileInput').click());
    document.getElementById('classFileInput').addEventListener('change', (e) => {
        if (e.target.files && e.target.files[0]) {
            const file = e.target.files[0];
            if (file.name.endsWith('.txt')) importTXTFile(file);
            else feedbackDiv.innerHTML = "❌ 请选择 .txt 格式";
        }
        document.getElementById('classFileInput').value = '';
    });
    bindPress(document.getElementById('addStudentBtn'), showAddStudentModal);
    bindPress(document.getElementById('exportDataBtn'), exportToJSON);
    bindPress(document.getElementById('restoreDataBtn'), () => document.getElementById('restoreFileInput').click());
    document.getElementById('restoreFileInput').addEventListener('change', (e) => {
        if (e.target.files && e.target.files[0]) restoreFromJSON(e.target.files[0]);
        e.target.value = '';
    });
    bindPress(document.getElementById('clearDataBtn'), clearAllDataWithPassword);

    // ===== 全屏切换（教室无键盘，触摸一键进入/退出全屏） =====
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    function toggleFullscreen() {
        const doc = document;
        const el = doc.documentElement;
        try {
            if (doc.fullscreenElement || doc.webkitFullscreenElement) {
                if (doc.exitFullscreen) { const p = doc.exitFullscreen(); if (p && p.catch) p.catch(() => {}); }
                else if (doc.webkitExitFullscreen) doc.webkitExitFullscreen();
            } else {
                if (el.requestFullscreen) { const p = el.requestFullscreen(); if (p && p.catch) p.catch(() => { feedbackDiv.innerHTML = "⚠️ 全屏失败，请检查浏览器设置"; }); }
                else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
                else feedbackDiv.innerHTML = "⚠️ 当前浏览器不支持全屏";
            }
        } catch (e) { feedbackDiv.innerHTML = "⚠️ 全屏失败，请检查浏览器设置"; }
    }
    function updateFullscreenBtnText() {
        const isFs = document.fullscreenElement || document.webkitFullscreenElement;
        if (fullscreenBtn) fullscreenBtn.innerText = isFs ? "⛶ 退出全屏" : "⛶ 全屏";
    }
    document.addEventListener('fullscreenchange', updateFullscreenBtnText);
    document.addEventListener('webkitfullscreenchange', updateFullscreenBtnText);
    bindPress(fullscreenBtn, toggleFullscreen);

    function init() {
        loadAllData();
        totalRounds = parseInt(roundCountSelect.value) || 15;
        groupDifficulty = groupDifficultySelect.value || 'multiply';
        switchMode('double');
    }
    init();
</script>
</body>
</html>
