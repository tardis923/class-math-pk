<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>智慧数学大比拼 | 四人赛</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: linear-gradient(145deg, #1e6b5e 0%, #0a3b32 100%);
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Comic Neue', 'PingFang SC', Roboto, sans-serif;
            padding: 0;
        }

        .game-container {
            width: 100%;
            height: 100vh;
            max-height: 100vh;
            background: rgba(255, 248, 225, 0.95);
            box-shadow: none;
            padding: 10px 14px 15px;
            overflow-y: auto;
            touch-action: pan-y;
            border-radius: 0;
        }
        .game-container::-webkit-scrollbar { width: 6px; }
        .game-container::-webkit-scrollbar-track { background: #e9dccd; border-radius: 3px; }
        .game-container::-webkit-scrollbar-thumb { background: #FFB347; border-radius: 3px; }

        h1 { 
            font-size: clamp(1.2rem, 3.5vw, 1.7rem); 
            text-align: center; 
            background: linear-gradient(135deg, #FFB74D, #FF8A65); 
            background-clip: text; 
            -webkit-background-clip: text; 
            color: transparent; 
            margin-bottom: 8px; 
        }

        /* ===== 整体布局：左侧控制栏 + 右侧主区 ===== */
        .app-layout {
            display: flex;
            gap: 10px;
            align-items: stretch;
            height: 100%;
            min-height: 0;
        }
        .side-controls {
            flex: 0 0 auto;
            width: 180px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: #f7e9d0;
            padding: 10px;
            border-radius: 26px;
            align-items: stretch;
            overflow-y: auto;
        }
        .side-controls h1 {
            font-size: clamp(0.85rem, 2vw, 1.05rem);
            text-align: center;
            margin: 0 0 2px;
        }
        .side-controls .mode-buttons { display: flex; gap: 6px; }
        .side-controls .mode-btn { flex: 1; padding: 9px 2px; font-size: 0.72rem; }
        .side-controls .round-selector,
        .side-controls .difficulty-selector { width: 100%; justify-content: space-between; }
        .side-controls .round-selector select,
        .side-controls .difficulty-selector select { max-width: 112px; }
        .side-controls .round-display { text-align: center; }
        .side-controls .manage-buttons { flex-direction: column; gap: 6px; }
        .side-controls .manage-buttons .file-label,
        .side-controls .manage-buttons .data-btn,
        .side-controls .manage-buttons .pause-btn {
            width: 100%; box-sizing: border-box;
            padding: 8px 2px; font-size: 0.72rem;
        }
        .side-controls .fullscreen-btn { width: 100%; box-sizing: border-box; padding: 9px 2px; }
        .main-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            min-height: 0;
        }
        .main-area .timer-bar { flex: 0 0 auto; }
        .main-area .rank-area { flex: 0 0 auto; }
        .main-area .battle-wrapper { flex: 1; }
        .main-area .feedback { flex: 0 0 auto; }
        .battle-wrapper.double-mode { align-items: center; }
        .mode-buttons { display: flex; gap: 6px; }
        .mode-btn {
            background: #e9dccd;
            border: none;
            padding: 7px 16px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
            touch-action: manipulation;
            transition: 0.05s linear;
        }
        .mode-btn:active { transform: scale(0.96); }
        .mode-btn.active { background: #FFB347; color: white; box-shadow: 0 2px 0 #b45f1b; }
        .mode-btn.active:active { transform: scale(0.96); }

        .round-selector {
            display: flex;
            align-items: center;
            gap: 5px;
            background: #FFF2DF;
            padding: 3px 10px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: bold;
            color: #5d3a1a;
        }
        .round-selector select {
            border: none;
            background: white;
            border-radius: 25px;
            padding: 3px 8px;
            font-weight: bold;
            font-size: 0.75rem;
            cursor: pointer;
        }

        .difficulty-selector {
            display: flex;
            align-items: center;
            gap: 5px;
            background: #FFF2DF;
            padding: 3px 10px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: bold;
            color: #5d3a1a;
        }
        .difficulty-selector select {
            border: none;
            background: white;
            border-radius: 25px;
            padding: 3px 8px;
            font-weight: bold;
            font-size: 0.75rem;
            cursor: pointer;
        }

        .round-display {
            font-size: 0.75rem;
            font-weight: bold;
            color: #d35400;
            background: #FFF2DF;
            padding: 4px 12px;
            border-radius: 30px;
        }

        .pause-btn {
            background: #5c8f7c;
            color: white;
            border: none;
            padding: 6px 16px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 0.8rem;
            cursor: pointer;
            touch-action: manipulation;
        }
        .pause-btn:active { transform: scale(0.96); background: #4a7364; }
        .pause-btn.paused { background: #FFB347; }

        .manage-buttons { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
        .file-label, .data-btn {
            background: #5c8f7c;
            border: none;
            padding: 6px 12px;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            font-size: 0.7rem;
            text-align: center;
            touch-action: manipulation;
            transition: 0.05s linear;
        }
        .file-label:active, .data-btn:active { transform: scale(0.96); background: #4a7364; }
        .file-label { background: #FFB347; }
        .danger-btn { background: #d9534f; }
        .reset-group-btn { background: #9b59b6; }
        .fullscreen-btn {
            background: #4682B4;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 0.8rem;
            cursor: pointer;
            touch-action: none;
            transition: 0.05s linear;
        }
        .fullscreen-btn:active { transform: scale(0.96); background: #3a6d99; }
        input[type="file"] { display: none; }
        .disabled-ctrl { opacity: 0.5; pointer-events: none; filter: grayscale(0.1); }
        .question-hidden { display: none !important; }

        /* 多点触控加固（适配希沃一体机）：可交互控件禁止浏览器手势接管（捏合/滚动/双击缩放），
           多人同时点按互不取消、互不误触；触摸按下立即响应，不等 click（希沃驱动下 click 易丢失或延迟） */
        .numpad, .num-btn, .action-btn, .ready-btn, .pick-student-btn, .random-icon,
        .mode-btn, .pause-btn, .data-btn, .file-label, .student-option, .uniform-btn,
        .modal-close, .delete-student-btn {
            touch-action: none;
        }

        .timer-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            background: #2c2e3e;
            border-radius: 50px;
            padding: 6px 20px;
            margin-bottom: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        .timer-bar .timer-label { color: #FFE484; font-size: 0.8rem; font-weight: bold; }
        .timer-bar .timer-digits { font-size: 1.8rem; font-weight: bold; font-family: monospace; color: #FFE484; letter-spacing: 2px; }
        .timer-bar .round-indicator { color: #FFE484; font-size: 0.85rem; font-weight: bold; background: rgba(255,255,255,0.1); padding: 4px 14px; border-radius: 30px; }

        .rank-area {
            background: #FFF3DD;
            border-radius: 40px;
            padding: 8px 12px;
            margin-bottom: 10px;
            border: 2px solid #FFB347;
            text-align: center;
        }
        .rank-title {
            font-size: 0.9rem;
            font-weight: bold;
            background: #FFB347;
            display: inline-block;
            padding: 3px 20px;
            border-radius: 40px;
            color: white;
            margin-bottom: 6px;
        }
        .rank-list {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
            max-height: 120px;
            overflow-y: auto;
            padding: 4px;
        }
        .rank-item {
            background: #EFE3CD;
            border-radius: 30px;
            padding: 3px 12px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-weight: bold;
            font-size: 0.75rem;
        }
        .rank-score { background: #d35400; color: white; border-radius: 25px; padding: 2px 10px; font-size: 0.7rem; }
        .delete-student-btn {
            background: #d9534f;
            color: white;
            border: none;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            font-size: 0.65rem;
            cursor: pointer;
            touch-action: manipulation;
        }
        .delete-student-btn:active { transform: scale(0.9); }
        .delete-student-btn.disabled-delete { opacity: 0.4; pointer-events: none; }

        .battle-wrapper {
            display: flex;
            flex-wrap: nowrap;
            justify-content: space-between;
            align-items: stretch;
            gap: 12px;
            margin-bottom: 12px;
        }
        .battle-wrapper.double-mode .player-card { min-width: 280px; }
        .battle-wrapper.group-mode .player-card { min-width: 220px; }

        /* ===== 小组赛：中上部大跑道(2/3) + 下方 1/3 四组答题卡并列 ===== */
        .group-mode .battle-wrapper {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            grid-template-rows: 2fr 1fr;
            gap: 10px;
            align-items: stretch;
        }
        .group-mode .battle-wrapper .group-race-area { grid-column: 1 / -1; grid-row: 1; }
        .group-mode .battle-wrapper .player-card { min-width: 0; }
        .group-mode .battle-wrapper .player-card:nth-child(2) { grid-row: 2; grid-column: 1; }
        .group-mode .battle-wrapper .player-card:nth-child(3) { grid-row: 2; grid-column: 2; }
        .group-mode .battle-wrapper .player-card:nth-child(4) { grid-row: 2; grid-column: 3; }
        .group-mode .battle-wrapper .player-card:nth-child(5) { grid-row: 2; grid-column: 4; }
        /* 小组赛隐藏双人计时条与总分榜，腾出空间给跑道和答题卡 */
        .group-mode .timer-bar { display: none; }
        .group-mode .rank-area { display: none; }

        .group-race-area {
            background: #2c2e3e;
            border-radius: 30px;
            padding: 8px 14px 10px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.25);
            color: #FFE484;
        }
        .race-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 6px;
            flex-wrap: wrap;
        }
        .race-title { font-size: 0.85rem; font-weight: bold; }
        .race-clock { font-size: 1.1rem; font-weight: bold; font-family: monospace; color: #FFE484; }
        .race-status {
            font-size: 0.75rem; font-weight: bold; color: #FFE484;
            background: rgba(255,255,255,0.12); padding: 3px 12px; border-radius: 30px;
        }
        .race-result {
            display: none;
            background: rgba(255,255,255,0.14);
            border: 2px solid #FFD966;
            border-radius: 20px;
            padding: 8px 16px;
            margin-bottom: 8px;
            font-size: 1rem;
            font-weight: bold;
            color: #FFF3C4;
            line-height: 1.6;
        }
        .race-result.show { display: block; }
        .race-lanes { position: relative; }
        .race-lane { position: relative; height: 32px; }
        .lane-track {
            position: absolute;
            left: 70px; right: 100px; top: 50%;
            height: 18px; transform: translateY(-50%);
            background: repeating-linear-gradient(90deg, #4a4d63 0 14px, #3a3d52 14px 28px);
            border-radius: 9px;
            border: 1px solid #2a2c3e;
        }
        .lane-track::after { /* 终点线 */
            content: "";
            position: absolute;
            right: 0; top: -3px; bottom: -3px;
            width: 4px;
            background: repeating-linear-gradient(180deg, #fff 0 5px, #111 5px 10px);
            border-radius: 2px;
        }
        .lane-name {
            position: absolute; left: 2px; top: 50%; transform: translateY(-50%);
            font-size: 0.68rem; font-weight: bold; color: #FFE484;
            width: 66px; text-align: right; padding-right: 4px;
            display: flex; align-items: center; justify-content: flex-end; gap: 3px;
        }
        .lane-name .mini-avatar { width: 18px; height: 18px; flex: 0 0 auto; }
        .lane-time {
            position: absolute; right: 0; top: 50%; transform: translateY(-50%);
            font-size: 0.68rem; font-weight: bold; color: #7ee2a8;
            width: 98px; text-align: left; padding-left: 4px;
        }
        .lane-runner {
            position: absolute; top: 50%;
            transform: translateY(-50%) translateX(-20%);
            left: 0; width: 28px; height: 28px; z-index: 3;
            transition: left 0.45s cubic-bezier(0.3, 1.1, 0.4, 1);
            filter: drop-shadow(0 2px 2px rgba(0,0,0,0.4));
        }
        .lane-runner.finished { filter: drop-shadow(0 0 6px #7ee2a8); }

        /* 小组赛卡片：下方 1/3 四列并列，内容紧凑可完整显示 */
        .group-mode h1 { font-size: 0.95rem; margin: 2px 0; }
        .group-mode .player-card { padding: 4px 6px; border-radius: 20px; }
        .group-mode .player-name-big { font-size: 0.8rem; padding: 2px 7px; }
        .group-mode .player-header { margin-bottom: 1px; gap: 3px; }
        .group-mode .ready-btn { font-size: 0.62rem; padding: 2px 0; margin-top: 1px; border-radius: 24px; }
        .group-mode .ready-status { display: none; } /* 按钮文字即状态，省一行 */
        .group-mode .score-board { font-size: 0.7rem; padding: 1px 2px; margin: 1px 0; }
        .group-mode .question-area { padding: 3px; border-radius: 14px; margin-bottom: 0; display: flex; flex-direction: column; flex: 1; }
        .group-mode .question-text { font-size: 0.85rem; }
        .group-mode .answer-area { padding: 2px; margin-top: 1px; display: flex; flex-direction: column; flex: 1; }
        .group-mode .answer-input { font-size: 0.88rem; min-height: 24px; padding: 2px 4px; margin-bottom: 2px; }
        .group-mode .numpad { gap: 3px; flex: 1; grid-auto-rows: 1fr; }
        .group-mode .num-btn { padding: 3px 0; font-size: 0.85rem; border-radius: 24px; }
        .group-mode .round-tag {
            display: inline-block;
            background: #9b59b6; color: white;
            border-radius: 30px; padding: 2px 9px;
            font-size: 0.62rem; font-weight: bold;
            margin-left: 4px;
        }
        .group-mode .round-tag.done { background: #27ae60; }
        /* 大跑道：占主区上方约 2/3，画面大而醒目（按 768px 视口高基准适配） */
        .group-mode .group-race-area { padding: 12px 198px 10px 18px; border-radius: 30px; } /* 右留白与左栏+左边距对称，赛道在宽屏视口正中 */
        .group-mode .race-head { margin-bottom: 8px; gap: 12px; }
        .group-mode .race-title { font-size: 1.2rem; }
        .group-mode .race-clock { font-size: 1.7rem; }
        .group-mode .race-status { font-size: 1rem; padding: 6px 20px; }
        .group-mode .race-lane { height: 96px; display: flex; align-items: center; }
        .group-mode .lane-name { position: relative; left: auto; top: auto; transform: none; flex: none; width: 210px; font-size: 1.1rem; justify-content: flex-start; }
        .group-mode .lane-name .mini-avatar { width: 42px; height: 42px; flex: 0 0 auto; }
        .group-mode .lane-track { position: relative; left: auto; right: auto; top: auto; transform: none; flex: 1; height: 44px; border-radius: 22px; margin: 0 6px; }
        .group-mode .lane-runner { width: 84px; height: 84px; }
        .group-mode .lane-time { position: relative; right: auto; top: auto; transform: none; flex: none; width: 210px; font-size: 1.1rem; text-align: right; }
        .group-mode .feedback { display: none; } /* 规则已显示在跑道顶部，页脚隐藏避免溢出 */
        /* 卡丁车：车轮持续旋转（仅在跑道内生效） */
        .group-mode .lane-runner svg { display: block; width: 100%; height: 100%; }
        .group-mode .lane-runner svg .kart-wheel { animation: kartSpin .32s linear infinite; }
        .group-mode .lane-runner svg .kart-wb { transform-box: view-box; transform-origin: 24px 78px; }
        .group-mode .lane-runner svg .kart-wf { transform-box: view-box; transform-origin: 76px 80px; }
        @keyframes kartSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .player-card {
            flex: 1;
            background: #FFFDF5;
            border-radius: 35px;
            padding: 10px 12px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
            border: 2px solid #FFD966;
            display: flex;
            flex-direction: column;
        }
        .player-card.paused-card {
            filter: blur(3px);
            pointer-events: none;
        }

        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 5px;
            gap: 5px;
        }
        .player-name-big {
            font-size: 1.1rem;
            background: #FFE0A3;
            padding: 3px 14px;
            border-radius: 40px;
            font-weight: bold;
        }
        .select-controls { display: flex; gap: 4px; }
        .pick-student-btn, .random-icon {
            background: #81b7b0;
            border: none;
            padding: 5px 10px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 0.75rem;
            color: white;
            cursor: pointer;
            touch-action: manipulation;
        }
        .pick-student-btn:active, .random-icon:active { transform: scale(0.95); background: #6a9e96; }
        .random-icon { background: #FFB347; padding: 5px 9px; }

        .ready-btn {
            background: #FFB347;
            border: none;
            border-radius: 50px;
            padding: 8px 0;
            margin-top: 5px;
            font-size: 0.9rem;
            font-weight: bold;
            color: white;
            cursor: pointer;
            touch-action: manipulation;
        }
        .ready-btn:active { transform: scale(0.97); background: #e0a03a; }
        .ready-btn.disabled-btn { background: #ccccaa; pointer-events: none; opacity: 0.6; }
        .ready-status { text-align: center; font-size: 0.65rem; margin-top: 2px; color: #d35400; }

        .score-board { font-size: 0.95rem; text-align: center; background: #F2E8D5; border-radius: 30px; padding: 3px; margin: 4px 0; }
        .score-board .total-score { font-size: 0.7rem; color: #7f8c8d; }

        .question-area {
            background: #fff6e5;
            border-radius: 30px;
            padding: 8px;
            text-align: center;
            border: 2px dashed #FFB347;
            margin-bottom: 5px;
        }
        .question-text { font-size: 1.1rem; font-weight: bold; color: #2d4a3b; font-family: monospace; }
        .answer-area { background: #f0e8d8; border-radius: 25px; padding: 5px; margin-top: 5px; }
        .answer-input {
            background: white;
            border-radius: 35px;
            padding: 6px 8px;
            text-align: center;
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 6px;
            border: 2px solid #FFB347;
            min-height: 40px;
        }
        .numpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
        .numpad-4col { grid-template-columns: repeat(4, 1fr); }
        .numpad-4col .num-btn-confirm { grid-column: span 4; }
        .num-btn {
            background: #81b7b0;
            border: none;
            padding: 8px 0;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: bold;
            color: white;
            cursor: pointer;
            touch-action: manipulation;
        }
        .num-btn:active { transform: scale(0.96); background: #6a9e96; }
        .action-btn { background: #FFB347; }
        .action-btn:active { background: #e0a03a; }
        .penalty-active .num-btn, .penalty-active .action-btn { pointer-events: none; opacity: 0.5; transform: none; }
        .player-card.disabled-click .num-btn, .player-card.disabled-click .action-btn { pointer-events: none; opacity: 0.6; transform: none; }

        .feedback {
            margin-top: 8px;
            text-align: center;
            background: #fff2cc;
            border-radius: 40px;
            padding: 6px;
            font-weight: bold;
            font-size: 0.75rem;
        }
        .countdown-overlay {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.85);
            color: #FFE484;
            font-size: 3.5rem;
            font-weight: bold;
            padding: 20px 40px;
            border-radius: 70px;
            z-index: 2000;
            font-family: monospace;
            backdrop-filter: blur(8px);
            text-align: center;
            pointer-events: none;
        }
        .student-modal, .password-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.75);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 3000;
        }
        .student-modal-content, .password-content {
            background: #FFFDF5;
            border-radius: 50px;
            padding: 20px;
            text-align: center;
            border: 3px solid #FFB347;
            max-width: 90vw;
        }
        .student-modal-content { width: 85%; max-width: 800px; max-height: 80vh; overflow-y: auto; }
        .student-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; margin-bottom: 15px; }
        .student-option {
            background: #81b7b0;
            border: none;

            border-radius: 50px;

        .group-mode-only { display: none; }

        .group-mode .double-mode-only { display: none; }

        @media (max-width: 1100px) {

            .group-mode .battle-wrapper .player-card:nth-child(5) { grid-row: 3; grid-column: 2; }

            .group-mode .battle-wrapper .player-card:nth-child(2) { grid-row: 2; }

            .group-mode .battle-wrapper .player-card:nth-child(4) { grid-row: 4; }
            .group-mode .battle-wrapper .player-card:nth-child(5) { grid-row: 5; }
        }

<body>
<div class="game-container" id="gameContainer">
    <div class="app-layout">
        <aside class="side-controls" id="sideControls">

                </select>
            </div>
            <div class="difficulty-selector group-mode-only">
                <span>难度：</span>
                <select id="groupDifficultySelect">
                    <option value="addsub">三位数加减</option>
                    <option value="muladdsub" selected>一位数乘一位数再加减</option>
                    <option value="decimal">两位数加减（带小数点后一位）</option>
                </select>
            </div>
            <div class="round-display group-mode-only" id="roundDisplay">共 15 题</div>
            <div class="manage-buttons">
                <label class="file-label double-mode-only" id="fileLabelBtn">📁 导入班级</label>
                <input type="file" id="classFileInput" accept=".txt">
                <button class="data-btn double-mode-only" id="addStudentBtn">➕ 新生</button>
                <button class="data-btn double-mode-only" id="exportDataBtn">💾 备份</button>

                <button class="data-btn danger-btn double-mode-only" id="clearDataBtn">🗑️ 清除双人</button>
                <button class="data-btn reset-group-btn group-mode-only" id="resetGroupBtn">🔄 重置比赛</button>

        </main>
